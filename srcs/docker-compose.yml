services:
  mariadb:
    image: mariadb:inception
    container_name: mariadb
    restart: always
    build:
      context: ./requirements/mariadb
    env_file:
      - .env
    secrets:
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
  
  wordpress:
    image: wordpress
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
  
  nginx:
    image: nginx:inception
    container_name: nginx
    build:
      context: ./requirements/nginx
    restart: always
    ports:
      - "8443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      - wordpress
  
secrets:
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nchairun/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nchairun/data/wordpress

networks:
  inception:
    driver: bridge