services:
  mariadb:
    image: mariadb
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    env_file:
      - .env
    secrets:
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
  
  wordpress:
    image: wordpress
    container_name: wordpress
    build:
      context: ./requirements/wordpress

  nginx:
    image: nginx
    container_name: nginx
    build:
      context: ./requirements/nginx

secrets:
  db_password:
    file: ../secrets/db_password.txt

volumes:
  mariadb_data:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /home/nchairun/data/mariadb

