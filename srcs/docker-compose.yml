# Each service then has its own Dockerfile:

# docker-compose.yml
#         │
#         ├──────────────┐
#         │              │
#         ▼              ▼
#  nginx/Dockerfile   wordpress/Dockerfile
#         │              │
#         ▼              ▼
#    nginx process   php-fpm process
#         │
#         ▼
#  mariadb/Dockerfile
#         │
#         ▼
#  mysqld process

#  services:
#   mariadb:
#     image: mariadb
#     build: ./requirements/mariadb

#   wordpress:
#     image: wordpress
#     build: ./requirements/wordpress

#   nginx:
#     image: nginx
#     build: ./requirements/nginx

services:
  mariadb:
    image: mariadb
    container_name: mariadb
    build:
      context: ./requirements/mariadb

  wordpress:
    image: wordpress
    container_name: wordpress
    build:
      context: ./requirements/wordpress

  nginx:
    image: nginx
    container_name: nginx
    build:
      context: ./requirements/nginx