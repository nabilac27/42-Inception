services:
# ------------------------ DOCKER SERVICE: MARIADB ------------------------
  mariadb:
    image: mariadb:inception
    container_name: mariadb
    restart: always
    build:
      context: ./requirements/mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
  
# ------------------------ DOCKER SERVICE: WORDPRESS ------------------------
  wordpress:
    image: wordpress:inception
    container_name: wordpress
    restart: always
    build:
      context: ./requirements/wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
  
# ------------------------ DOCKER SERVICE: NGINX ------------------------
  nginx:
    image: nginx:inception
    container_name: nginx
    restart: always
    build:
        context: .
        dockerfile: requirements/nginx/Dockerfile
    ports:
      - "443:443" # 443 | https://localhost:8443 (later https://nchairun.42.fr)
    volumes:
      - wordpress_data:/var/www/html:ro
      - nginx_logs:/var/log/nginx             # GOACCESS
      - goaccess_report:/var/www/goaccess:ro  # GOACCESS
    networks:
      - inception
    depends_on:
      - wordpress
      - adminer

# ------------------------ DOCKER SERVICE: GOACCESS ------------------------
  goaccess:
    container_name: goaccess
    build:
      context: ./requirements/bonus/goaccess
    image: goaccess:inception
    restart: always
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - goaccess_report:/var/www/goaccess
    networks:
      - inception
    depends_on:
      - nginx

# ------------------------ DOCKER SERVICE: ADMINER ------------------------
  adminer:
    image: adminer:inception
    container_name: adminer
    restart: always
    build:
      context: ./requirements/bonus/adminer
    networks:
      - inception
    depends_on:
      - mariadb
    
# ------------------------ DOCKER SERVICE: REDIS ------------------------
  redis:
    image: redis:inception
    container_name: redis
    restart: always
    build:
      context: ./requirements/bonus/redis
    networks:
      - inception

# ------------------------ DOCKER SECRETS ------------------------
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

# ------------------------ DOCKER VOLUMES ------------------------
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress

  nginx_logs:
  goaccess_report:

# ------------------------ DOCKER NETWORK ------------------------
networks:
  inception:
    driver: bridge