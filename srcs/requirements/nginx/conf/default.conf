# ------------------------ SERVER CONFIGURATION -----------------------------------
server 
{
    listen      443 ssl;
    server_name nchairun.42.fr;

# ------------------------ TLS CONFIGURATION  -------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

# ------------------------ WORDPRESS DOCMENT ROOT ---------------------------------
    root    /var/www/html;
    index   index.php;


# ------------------------ BONUS: ADMINER -----------------------------------------
    location = /bonus-adminer {
        return 301 /bonus-adminer/;
    }

    location ^~ /bonus-adminer/ {
        proxy_pass http://adminer/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

# ------------------------ BONUS: STATIC WEBSITE ----------------------------------
    location = /bonus-static-web {
        return 301 /bonus-static-web/;
    }

    location ^~ /bonus-static-web/ {
        alias /var/www/static/website/;
        index index.html;
        try_files $uri $uri/ =404;
    }

# ------------------------ LOCATION BLOCK (WORDPRESS URL) -------------------------
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }


# ------------------------ PHP-FPM COMMUNICATION ----------------------------------
    location ~ \.php$
    {
        include         fastcgi_params;
        fastcgi_pass    wordpress:9000;

        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param   SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param   REQUEST_URI $request_uri;
        fastcgi_param   QUERY_STRING $query_string;

        fastcgi_param   HTTPS on;
        fastcgi_param   HTTP_HOST $http_host;
        fastcgi_param   SERVER_PORT 8443;   # 443
    }
}